modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/xiaoyue1-1/Mek-create-Turbine/issues"

[[mods]]
modId = "mek_create_turbine"
version = "0.1.0"
displayName = "Mek Create Turbine"
authors = "xiaoyue1-1"
description = '''
Steam turbine that can also output Create rotational force.
Mechanical mode: output stress to Create, no electricity output.
Shell blocks are own; internals reuse Mekanism blocks (disperser/coil/condenser/complex/rotor/structural glass).
'''

# Mekanism is required: internals & framework are reused.
[[dependencies.mek_create_turbine]]
    modId = "mekanism"
    mandatory = true
    versionRange = "[10.7,)"
    ordering = "AFTER"
    side = "BOTH"

# Mekanism Generators is required: turbine data/validator/rotor/blade internals live here.
[[dependencies.mek_create_turbine]]
    modId = "mekanismgenerators"
    mandatory = true
    versionRange = "[10.7,)"
    ordering = "AFTER"
    side = "BOTH"

# Create is required: the mechanical (stress) output uses its kinetic API.
[[dependencies.mek_create_turbine]]
    modId = "create"
    mandatory = true
    versionRange = "[6.0,)"
    ordering = "AFTER"
    side = "BOTH"

# NeoForge is implied; declare for correctness.
[[dependencies.mek_create_turbine]]
    modId = "neoforge"
    mandatory = true
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"
