# NeoForge / Minecraft
minecraft_version=1.21.1
neoforge_version=21.1.249
java_version=21

# Network resilience for flaky mirrors
org.gradle.daemon=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000

# 如果你的网络需要走代理（例如科学上网客户端），把下面 4 行取消注释并改成你的端口：
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7890
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7890

# Mod metadata
mod_id=mek_create_turbine
mod_name=Mek Create Turbine
mod_version=0.1.0
mod_license=MIT
mod_author=you

# Dependencies (real, resolvable versions found 2026-09)
